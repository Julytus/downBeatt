# =====================================================================
# LOCAL DEV: chỉ hạ tầng (mysql, redis, minio, mailpit) — dự án DownBeat cho backend chạy trên máy (:9200)
# và frontend chạy bằng Vite (:4200). Dùng chung biến với backend/.env.
#
#   docker compose -f docker-compose.local.yml --env-file backend/.env up -d
#   docker compose -f docker-compose.local.yml --env-file backend/.env --profile tools up -d   (+ phpMyAdmin)
#
# Tách hoàn toàn với stack deploy (docker-compose.yml) và với stack cũ "doan" (doAn-*):
# project, container, volume, cổng đều khác nên chạy song song được.
# =====================================================================
name: downbeat

services:
  downbeat-mailpit:
    container_name: downBeat-mailpit
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1026}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8026}:8025"

  downbeat-mysql:
    container_name: downBeat-mysql
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-downBeat}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3326}:3306"
    volumes:
      - downbeat-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  downbeat-redis:
    container_name: downBeat-redis
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6399}:6379"
    volumes:
      - downbeat-redis-data:/data

  downbeat-minio:
    container_name: downBeat-minio
# MinIO gỡ ảnh community khỏi Docker Hub + quay.io (10/2025). Dùng bản rebuild cộng đồng, ghim theo digest.
    image: netvark/minio:latest@sha256:77281ea99af0d02e2880e91d345bf81cae584454aedffbb7912331774f42d4bf
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9020}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9021}:9001"
    volumes:
      - downbeat-minio-data:/data

  downbeat-phpmyadmin:
    container_name: downBeat-phpmyadmin
    image: phpmyadmin:5
    restart: unless-stopped
    profiles: ["tools"]
    environment:
      PMA_HOST: downbeat-mysql
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8092}:80"
    depends_on:
      - downbeat-mysql

volumes:
  downbeat-mysql-data:
  downbeat-redis-data:
  downbeat-minio-data:
