# =====================================================================
# DEV: chạy trong docker (server dev), các service gọi nhau qua tên container.
# MỌI giá trị nhạy cảm phải truyền qua biến môi trường (docker-compose / CI).
# =====================================================================
server:
  port: ${BACKEND_PORT:8088}
  # Chạy sau nginx: lấy IP/scheme thật từ X-Forwarded-* (chỉ tin proxy trong mạng nội bộ docker)
  forward-headers-strategy: native

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/${MYSQL_DATABASE:downBeat}?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}

logging:
  level:
    vn.aeoc: INFO
    org.jooq: INFO

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}

system:
  enabled-register: true

springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true
