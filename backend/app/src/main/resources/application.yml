# =====================================================================
# Cấu hình CHUNG cho mọi môi trường.
# Giá trị riêng từng môi trường nằm ở application-{local|dev}.yml
# Chọn môi trường: SPRING_PROFILES_ACTIVE=local|dev (mặc định: local)
# =====================================================================
server:
  servlet:
    context-path: /api

spring:
  application:
    name: downbeat-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # Chỉ nạp backend/.env (chạy từ backend/, backend/app/ hoặc gốc repo). KHÔNG nạp .env ở gốc repo:
    # đó là secret của server (docker compose), dev local không được dùng.
    # Mỗi đường dẫn chỉ trúng backend/.env khi chạy từ đúng 1 thư mục: backend/ | backend/app/ | gốc repo
    import: optional:file:../backend/.env[.properties],optional:file:../../backend/.env[.properties],optional:file:./backend/.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 3000
      leak-detection-threshold: 20000
      max-lifetime: 1500000
      pool-name: downbeat-hikari
  flyway:
    enabled: true
    # Schema dùng chung mọi môi trường; local thêm classpath:db/seed (application-local.yml)
    locations: classpath:db/migration
    # DB đã có bảng nhưng chưa có flyway_schema_history (vd khôi phục từ dump) => đánh dấu V1 rồi chạy V2+
    baseline-on-migrate: true
    baseline-version: 1
    # Không bao giờ cho Flyway xoá schema
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB
      # File > 1MB ghi tạm ra đĩa thay vì giữ trong heap
      file-size-threshold: 1MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    org.jooq.tools.LoggerListener: OFF
    org.jooq.Constants: OFF
#    root: OFF
#    vn.aeoc: INFO

security:
  enabled: true
  jwt:
    enabled: true
    secret-key: ${JWT_SECRET_KEY}
    header: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
    # Access token (ms): ngắn để khoá/đổi mật khẩu có hiệu lực nhanh; client tự gia hạn qua POST /auth/refresh
    expired-in: 1800000000
    # Refresh token (MySQL, dùng 1 lần, bị thu hồi khi đổi mật khẩu / khoá / xoá user)
    refresh-expired-in: 30d
  api-key:
    value: ${API_KEY:admin_api_key}
  # Chống dò mật khẩu theo tài khoản (Caffeine, trong bộ nhớ; restart là mất bộ đếm). Giới hạn theo IP do nginx đảm nhận.
  guard:
    login-max-failures: 10
    login-lock-duration: 15m

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  bucket: ${MINIO_BUCKET:downbeat-public}
  private-bucket: ${MINIO_PRIVATE_BUCKET:downbeat-lut}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}

upload:
  # Giới hạn 1 file; nginx client_max_body_size phải >= giá trị này
  max-size: ${UPLOAD_MAX_SIZE:10MB}

app:
  rate-limit:
    enabled: true
    max-requests: 120
    window: 30s


system:
  enabled-register: true
  # Chưa kiểm tra audience của token Google => để false cho tới khi bổ sung
  enabled-google-login: false
  # URL công khai tới MinIO qua nginx (location /s3/). URL file = {file-url}/{bucket}/{yyyy/MM/dd/uuid.ext}
  file-url: ${SYSTEM_FILE_URL:http://localhost/s3}
  frontend-url: ${FRONTEND_URL:http://localhost:4500}

payos:
  base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}

lut:
  feature:
    compute-on-startup: ${LUT_FEATURE_COMPUTE_ON_STARTUP:true}
  download:
    url-ttl: ${LUT_DOWNLOAD_URL_TTL:5m}

collection:
  free-limit: ${COLLECTION_FREE_LIMIT:3}

recommend:
  weights:                 # tự chia cho tổng nếu tổng khác 1; có trọng số âm hoặc tổng = 0 → app không khởi động
    tag: 0.30
    color: 0.25
    category: 0.15
    style: 0.15
    text: 0.10
    creator: 0.05
  similarity-top: 50       # số LUT lưu cho mỗi LUT trong lut_similarity
  build-on-startup: true   # dựng chỉ mục khi ApplicationReadyEvent
  rebuild-cron: "0 0 3 * * *"
  tag-synonyms:            # mỗi nhóm một dòng, phần tử đầu là dạng chuẩn
    - [đen trắng, trắng đen, b&w, bw, black and white]
    - [vintage, cổ điển, retro]
    - [phim, film]
  text-stopwords: [của, và, cho, là, những, các, với, một, được, có, này, như, rất, khi]
  event:                  # trọng số sự kiện (Phụ lục B)
    view: 1
    preview: 2
    search: 0.5
    filter-style: 0.5
    favorite: 4
    download: 5
    purchase: 6
    dismiss: -4
  half-life-days: 30      # ≤ 0 nghĩa là không suy giảm (dùng cho thí nghiệm ∞ ở lát 3.1)
  history-days: 180
  history-max-pairs: 200
  cold-start-k: 5
  event-dedup-minutes: 30
  profile-cache-minutes: 5
  preference-max: 12
  event-cleanup-cron: "0 30 0 * * *"
  mmr-lambda: 0.7
  candidate-top: 100
  premium-max-ratio: 0.34
  related-personal-ratio: 0.2
  popular-days: 30
  for-you-limit: 12
  for-you-max-limit: 24
  variant: cbf-full
  stats-download-window-minutes: 30
  stats-max-days: 366

seed:
  minio:
    # Chỉ bật ở local, nơi db/seed chạy
    enabled: false



