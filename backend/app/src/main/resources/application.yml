# =====================================================================
# Cấu hình CHUNG cho mọi môi trường.
# Giá trị riêng từng môi trường nằm ở application-{local|dev}.yml
# Chọn môi trường: SPRING_PROFILES_ACTIVE=local|dev (mặc định: local)
# =====================================================================
server:
  servlet:
    context-path: /api

spring:
  application:
    name: downbeat-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  config:
    # Chỉ nạp backend/.env (chạy từ backend/, backend/app/ hoặc gốc repo). KHÔNG nạp .env ở gốc repo:
    # đó là secret của server (docker compose), dev local không được dùng.
    # Mỗi đường dẫn chỉ trúng backend/.env khi chạy từ đúng 1 thư mục: backend/ | backend/app/ | gốc repo
    import: optional:file:../backend/.env[.properties],optional:file:../../backend/.env[.properties],optional:file:./backend/.env[.properties]
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 3000
      leak-detection-threshold: 20000
      max-lifetime: 1500000
      pool-name: downbeat-hikari
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 500ms
  flyway:
    enabled: true
    # Schema dùng chung mọi môi trường; local thêm classpath:db/seed (application-local.yml)
    locations: classpath:db/migration
    # DB đã có bảng nhưng chưa có flyway_schema_history (vd khôi phục từ dump) => đánh dấu V1 rồi chạy V2+
    baseline-on-migrate: true
    baseline-version: 1
    # Không bao giờ cho Flyway xoá schema
    clean-disabled: true
  servlet:
    multipart:
      max-file-size: ${upload.max-size}
      max-request-size: 50MB
      # File > 1MB ghi tạm ra đĩa thay vì giữ trong heap
      file-size-threshold: 1MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # SMTP không ảnh hưởng việc phục vụ request => không làm container "unhealthy"
    mail:
      enabled: false

logging:
  level:
    org.jooq.tools.LoggerListener: OFF
    org.jooq.Constants: OFF
#    root: OFF
#    vn.aeoc: INFO

security:
  enabled: true
  jwt:
    enabled: true
    secret-key: ${JWT_SECRET_KEY}
    header: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
    # Access token (ms): ngắn để khoá/đổi mật khẩu có hiệu lực nhanh; client tự gia hạn qua POST /auth/refresh
    expired-in: 1800000000
    # Refresh token (Redis, dùng 1 lần, bị thu hồi khi đổi mật khẩu / khoá / xoá user)
    refresh-expired-in: 30d
  api-key:
    value: ${API_KEY:admin_api_key}
  # Chống dò mật khẩu / OTP theo tài khoản (Redis). Giới hạn theo IP nằm ở nginx (zone auth_limit)
  guard:
    otp-ttl: 5m
    otp-max-attempts: 5
    otp-resend-interval: 60s
    login-max-failures: 10
    login-lock-duration: 15m

minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  bucket: ${MINIO_BUCKET:crm}
  access-key: ${MINIO_ROOT_USER:minioadmin}
  secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}

upload:
  # Giới hạn 1 file; nginx client_max_body_size phải >= giá trị này
  max-size: ${UPLOAD_MAX_SIZE:10MB}

app:
  cache:
    template:
      l1-max-size: 50000
      l1-ttl: 2m
      redis-ttl: 10m
      lock-ttl: 10s
      wait-timeout: 2s
      wait-poll-interval: 60ms
      single-flight-timeout: 5s
  rate-limit:
    enabled: true
    max-requests: 120
    window: 30s


system:
  enabled-register: true
  # Chưa kiểm tra audience của token Google => để false cho tới khi bổ sung
  enabled-google-login: false
  # URL công khai tới MinIO qua nginx (location /s3/). URL file = {file-url}/{bucket}/{yyyy/MM/dd/uuid.ext}
  file-url: ${SYSTEM_FILE_URL:http://localhost/s3}

